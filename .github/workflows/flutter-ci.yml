name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean generated outputs
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android APK
        # Build one universal APK that includes all supported ABIs.
        run: flutter build apk --release

      - name: Upload universal release APK
        uses: actions/upload-artifact@v4
        with:
          name: myfnt-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
