name: myfnt
description: "تطبيق Myfnt لإدارة الحجوزات والتقويم باللغة العربية."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Local Database
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1

  # البنية التحتية (Session 1)
  uuid: ^4.5.1
  crypto: ^3.0.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
